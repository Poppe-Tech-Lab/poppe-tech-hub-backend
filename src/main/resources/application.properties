spring.application.name=techhub

# Permite reaproveitar o mesmo .env do docker compose ao rodar a aplicação localmente.
# O arquivo é opcional e está no .gitignore; nenhum segredo fica versionado.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:techhub}}
spring.datasource.username=${DB_USERNAME:techhub}
spring.datasource.password=${DB_PASSWORD}

# O schema é responsabilidade do Flyway; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# Cadastro direto via HTTP: proteção operacional para não expor o endpoint em produção.
# O endpoint também exige autenticação Basic. Em desenvolvimento, habilite no .env.
app.users.direct-registration-enabled=${USER_DIRECT_REGISTRATION_ENABLED:false}

server.port=${SERVER_PORT:8080}
